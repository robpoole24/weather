<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@500;600&display=swap');
body.classic{--bg:#050a2e;--frame:#8fa6ff;--panel:#1a2fb0;--chan:#14228a;--cell:#1b2a9c;--sel:#3352f0;--selb:#ffe63b;--line:#8fa6ff;--head:#2a44d6;--headt:#ffe63b;--title:#ffe63b;--sub:#ffe63b;--num:#ffe63b;--band:#0b1460;--bandt:#ffffff;--text:#ffffff;--muted:#c9d4ff;--live:#e11d2e;--btn:#ffe63b;--btnt:#0b1460;--tab:#14228a;--bar:#0b1460;--r:0px}
body.wtv{--bg:#03101b;--frame:#22d3ee;--panel:#0a2236;--chan:#061827;--cell:#0a1d2f;--sel:#173a55;--selb:#ff8a1f;--line:#1b6b80;--head:#0c2a40;--headt:#22d3ee;--title:#ffa24a;--sub:#7fe3f3;--num:#ffa24a;--band:#05253a;--bandt:#22d3ee;--text:#f1f8ff;--muted:#a9cadb;--live:#e11d2e;--btn:#ff8a1f;--btnt:#03101b;--tab:#061827;--bar:#061827;--r:6px}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
[hidden]{display:none !important}
body{font-family:'Barlow Condensed','Noto Sans Bengali',sans-serif}
button{font-family:inherit}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);color:var(--text);overflow:hidden}

/* ── Guide ── */
#guide{display:none}
#stage.guiding #guide{display:block}
#top{position:absolute;left:12px;top:12px;width:1256px;height:300px;display:flex;gap:8px}
#pv{width:533px;height:300px;flex:none;box-sizing:border-box;border:3px solid var(--frame);border-radius:var(--r);background:radial-gradient(120% 90% at 30% 35%,#2b3746 0%,#141b25 55%,#07090d 100%);position:relative;overflow:hidden}
#slate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px;color:var(--muted);background:#000;overflow:hidden}
#slate .rings{position:absolute;top:50%;left:50%;width:0;height:0}
.radar-ring{position:absolute;width:220px;height:220px;margin-left:-110px;margin-top:-110px;border-radius:50%;border:2px solid rgba(0,212,245,.45);animation:radarPulse 4.5s ease-out infinite}
.radar-ring:nth-child(2){border-color:rgba(249,115,22,.45);animation-delay:1.5s}
.radar-ring:nth-child(3){animation-delay:3s}
@keyframes radarPulse{0%{transform:scale(.3);opacity:.8}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.radar-ring{animation:none}}
#slate img{width:270px;max-width:70%;position:relative;z-index:1}
#sl-cap{position:relative;z-index:1;display:flex;gap:10px;align-items:baseline;justify-content:center}
#sl-cap:empty{display:none}
#sl-cap b{font-size:26px;color:var(--num);line-height:1}
#sl-cap span{font-size:20px;color:#fff;font-weight:600}
#sl-cap small{font-size:15px}
#pvbug{position:absolute;left:24px;top:262px;z-index:7;display:flex;gap:8px;align-items:baseline;text-shadow:0 2px 4px #000;pointer-events:none}
#pvbug b{font-size:30px;color:var(--num)}#pvbug span{font-size:18px;font-weight:600;color:#fff}
#info{flex:1 1 0;min-width:0;box-sizing:border-box;background:var(--panel);border:3px solid var(--frame);border-radius:var(--r);padding:14px 26px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#i-block{font-size:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#i-title{font-size:30px;line-height:1.1;font-weight:700;color:var(--title);max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#i-creator{font-size:22px;font-weight:600}
#i-status{font-size:20px;font-weight:600}
#i-status.live{color:#ff6b6b}
#i-next{font-size:17px;color:var(--muted);max-width:640px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.btn{border:0;background:var(--btn);color:var(--btnt);font-weight:700;font-size:18px;letter-spacing:.06em;padding:7px 18px;border-radius:var(--r);cursor:pointer;text-decoration:none;display:inline-block;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line);padding:5px 16px}
.btn.green{background:#15803d;color:#fff}
#grid{position:absolute;left:12px;top:320px;width:1256px;height:348px;box-sizing:border-box;border:2px solid var(--line);border-radius:var(--r);background:var(--line);display:flex;flex-direction:column;gap:2px;overflow:hidden}
#ghead{display:flex;gap:2px;height:28px;flex:none}
#ghead div{background:var(--head);color:var(--headt);font-size:18px;font-weight:700;letter-spacing:.08em;display:flex;align-items:center;justify-content:center}
#clock{width:150px;flex:none;color:#fff !important}
#rows{flex:1 1 0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:2px}
.row{display:flex;gap:2px;height:38px;flex:none}
.chan{width:150px;flex:none;background:var(--chan);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;border:0;margin:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.chan:hover b{text-decoration:underline}
/* Network badges (WeatherFront, WeatherWise…): first on the left, a second on the right */
.chan{position:relative}
.chan .nb{position:absolute;top:50%;transform:translateY(-50%);height:24px;max-width:30px;display:flex;align-items:center;justify-content:center;pointer-events:none}
.chan .nb.n0{left:5px}.chan .nb.n1{right:5px}
.chan .nb img{height:24px;width:auto;max-width:30px;border-radius:4px;object-fit:contain;display:block}
.chan .nb i{font-style:normal;font-size:10px;font-weight:700;background:var(--band);color:var(--bandt);border-radius:3px;padding:2px 3px;letter-spacing:.02em}
#chm-net{font-size:18px;color:var(--text);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#chm-net img{height:26px;width:auto;border-radius:4px;vertical-align:middle}
#chm-net span{display:inline-flex;align-items:center;gap:6px}
#chm-fam{font-size:18px;color:var(--text);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#chm-fam button{font:inherit;font-size:16px;font-weight:600;background:var(--chan);color:inherit;border:2px solid transparent;border-radius:var(--r);padding:4px 10px;cursor:pointer}
#chm-fam button:hover,#chm-fam button:focus{border-color:var(--selb);outline:none}
#chm-net:empty,#chm-fam:empty{display:none}
/* Channel details (click the number / tag, or press I) */
#chm{position:absolute;inset:0;z-index:22;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center}
#chm.on{display:flex}
#chm .box{width:620px;background:var(--panel);border:3px solid var(--selb);border-radius:var(--r);padding:22px 28px;display:flex;flex-direction:column;gap:8px}
#chm .top{display:flex;align-items:baseline;gap:14px}
#chm .top b{font-size:52px;color:var(--num);line-height:1}
#chm .top span{font-size:22px;font-weight:600;color:var(--muted);letter-spacing:.06em}
#chm-name{font-size:34px;font-weight:700;color:var(--title);line-height:1.1}
#chm-line{font-size:19px;color:var(--text)}
#chm-status{font-size:18px;color:var(--muted)}
#chm .btns{justify-content:flex-start;margin-top:10px}
.chan b{font-size:19px;color:var(--num)}.chan span{font-size:14px;font-weight:600;margin-top:2px;letter-spacing:.04em}
.cell{flex:1 1 0;min-width:0;margin:0;box-sizing:border-box;border:2px solid transparent;border-radius:0;background:var(--cell);color:var(--text);text-align:left;padding:1px 8px;display:flex;flex-direction:column;justify-content:center;cursor:pointer}
.cell .l{display:flex;align-items:center;min-width:0}
.cell .t{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .s{font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell.sel{background:var(--sel);border-color:var(--selb)}
.cell.empty{cursor:default;color:var(--muted);font-size:14px;justify-content:center}
.live{font-style:normal;background:var(--live);color:#fff;font-weight:700;font-size:11px;padding:0 4px;margin-right:6px;letter-spacing:.08em;flex:none}
.band{height:22px;flex:none;background:var(--band);color:var(--bandt);display:flex;justify-content:space-between;align-items:center;padding:0 12px;font-size:15px;font-weight:700;letter-spacing:.12em}
.band span:last-child{color:var(--muted);font-weight:600}

/* ── Watching (the main player screen) ── */
#watch{display:none}
#stage.watching #watch{display:block}
#player{position:absolute;z-index:6;left:12px;top:12px;width:533px;height:300px;box-sizing:border-box;border:3px solid var(--frame);border-radius:var(--r);background:#000;overflow:hidden;transition:left .35s ease,top .35s ease,width .35s ease,height .35s ease}
#player.hide{visibility:hidden}
#player iframe{width:100%;height:100%;border:0;display:block}
#stage.full #player{border:0;border-radius:0}
#side{position:absolute;left:900px;top:12px;width:368px;box-sizing:border-box;border:3px solid var(--frame);border-radius:var(--r);background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;gap:2px;background:var(--line);flex:none}
#tabs button{flex:1 1 0;height:40px;border:0;margin:0;font-size:18px;font-weight:700;letter-spacing:.1em;cursor:pointer;background:var(--tab);color:var(--text)}
#tabs button.on{background:var(--btn);color:var(--btnt)}
#tabs button.min{flex:none;width:44px;font-size:22px}
.pane{flex:1 1 0;min-height:0;display:none;position:relative}
.pane.on{display:block}
#map{position:absolute;inset:0;background:#132119}
#maplabel{position:absolute;left:10px;top:10px;right:10px;z-index:500;background:rgba(0,0,0,.65);padding:3px 10px;font-size:16px;font-weight:600;color:#fff}
#mapnote{position:absolute;left:10px;bottom:10px;z-index:500;background:rgba(0,0,0,.6);padding:2px 8px;font-size:13px;color:#d6e2da}
#chatf{width:100%;height:100%;border:0;background:#fff}
#recent{position:absolute;inset:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;background:var(--line)}
#recent button{flex:none;border:0;margin:0;text-align:left;background:var(--cell);color:var(--text);padding:8px 12px;cursor:pointer}
#recent button.cur{background:var(--sel)}
#recent .t{display:block;font-size:17px;font-weight:600;line-height:1.15}
#recent .s{font-size:14px;color:var(--sub)}
#banner{position:absolute;left:12px;top:528px;width:1256px;height:140px;box-sizing:border-box;display:flex;gap:2px;background:var(--line);border:2px solid var(--line);border-radius:var(--r);overflow:hidden}
#b-chan{width:150px;flex:none;background:var(--chan);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#b-chan b{font-size:44px;color:var(--num)}#b-chan span{font-size:20px;font-weight:600;margin-top:4px}
#b-mid{flex:1 1 0;min-width:0;background:var(--panel);padding:10px 20px;display:flex;flex-direction:column;justify-content:center;gap:4px}
#b-block{font-size:16px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
#b-title{font-size:28px;font-weight:700;line-height:1.05;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#b-status{font-size:19px;font-weight:600}
#b-next{width:330px;flex:none;background:var(--cell);padding:10px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;position:relative}
#b-next small{font-size:15px;font-weight:700;letter-spacing:.1em;color:var(--headt)}
#b-next span{font-size:19px;font-weight:600;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#b-next em{font-style:normal;font-size:14px;color:var(--sub)}
#b-min{position:absolute;right:6px;top:6px;width:34px;height:30px;border:0;background:var(--tab);color:var(--text);font-size:20px;font-weight:700;cursor:pointer;border-radius:var(--r)}
#osd{position:absolute;left:24px;bottom:64px;z-index:9;background:rgba(5,10,46,.88);border:2px solid var(--frame);padding:10px 18px;display:none;max-width:900px}
#osd.on{display:block}
#osd b{font-size:34px;color:var(--num);margin-right:12px}#osd span{font-size:24px;font-weight:600}
#osd div{font-size:20px;color:var(--title);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#stage:not(.guiding) #pvbug{display:none}
/* Forecast, Live Radar, WeatherStar, About…: a page opened above the bottom bar (the frame
   sits outside the scaled stage so the page renders at the screen's real size) */
#stage.apping #guide,#stage.apping #watch,#stage.apping #player{display:none}
#appframe{position:fixed;z-index:5;border:0;display:none;background:#0a0e14}
#bar .btn.on{outline:3px solid var(--selb);outline-offset:-3px}
#bar .btn.green.on{outline-color:#fff}
/* ── Bottom bar: always there (except true full screen) ── */
#bar{position:absolute;left:0;right:0;bottom:0;height:46px;z-index:8;background:var(--bar);border-top:2px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-sizing:border-box;gap:10px}
#bar .k{display:flex;gap:8px;align-items:center;min-width:0}
#bar .btn{font-size:16px;padding:4px 12px}
#bar .btn.ghost{padding:2px 10px}
#bar .chip{background:transparent;color:var(--headt);border:2px dashed var(--line);font-weight:700;font-size:15px;padding:2px 10px;border-radius:var(--r);cursor:pointer}
#wx{font-size:18px;font-weight:700;white-space:nowrap;color:var(--text);text-decoration:none}
#wx b{color:var(--num);font-size:22px;margin-right:6px}
#barclock{font-size:18px;font-weight:600;color:var(--muted);white-space:nowrap}
#stage.full #bar{display:none}
#numbox{position:absolute;right:24px;top:20px;z-index:10;background:var(--panel);border:3px solid var(--selb);font-size:40px;font-weight:700;color:var(--num);padding:2px 18px;display:none}
/* Blocks menu: opens over the left of the grid */
#nav{position:absolute;left:12px;top:320px;width:330px;height:348px;z-index:9;box-sizing:border-box;background:var(--panel);border:3px solid var(--selb);border-radius:var(--r);display:none;flex-direction:column;box-shadow:12px 0 30px rgba(0,0,0,.55)}
#nav.on{display:flex}
#nav h3{margin:0;padding:8px 14px 4px;font-size:22px;letter-spacing:.1em;color:var(--title)}
#nav p{margin:0;padding:0 14px 6px;font-size:14px;color:var(--muted)}
#navlist{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:2px;background:var(--line);border-top:2px solid var(--line)}
.nv{display:flex;align-items:center;gap:10px;background:var(--cell);padding:0 10px 0 6px;height:34px;flex:none;cursor:pointer;border:2px solid transparent}
.nv.foc{border-color:var(--selb);background:var(--sel)}
.nv.off .nl{opacity:.45;text-decoration:line-through}
.nv .ck{width:26px;height:26px;flex:none;border:2px solid var(--line);background:transparent;color:var(--btn);font-size:18px;font-weight:700;line-height:20px;padding:0;cursor:pointer;border-radius:var(--r)}
.nl{flex:1 1 0;min-width:0;font-size:17px;font-weight:600;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv small{font-size:14px;color:var(--muted);flex:none}
#navkeys{padding:5px 12px;font-size:13px;color:var(--muted);letter-spacing:.04em}
#navkeys b{color:var(--text)}
/* Watch / warning ticker: the very bottom of the screen, under the bar */
#ticker{position:absolute;left:0;right:0;bottom:0;height:30px;z-index:12;display:none;background:var(--tk,#d4a017);color:#fff;overflow:hidden}
#stage.ticking #ticker{display:flex}
#stage.ticking #bar{bottom:30px}
#stage.ticking #grid,#stage.ticking #nav{height:318px}
#tk-label{flex:none;background:rgba(0,0,0,.45);padding:0 12px;display:flex;align-items:center;font-size:17px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
#tk-wrap{flex:1 1 0;min-width:0;overflow:hidden;display:flex;align-items:center}
#tk-text{display:inline-block;white-space:nowrap;font-size:18px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.6);animation:tk 40s linear infinite;will-change:transform}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--muted);z-index:30;background:var(--bg)}
</style>
</head>

      <button type="button" class="btn" id="chm-watch">OK · WATCH</button>
      <a class="btn ghost" id="chm-yt" href="#" target="_blank" rel="noopener">YOUTUBE CHANNEL ↗</a>
      <button type="button" class="btn ghost" id="chm-close">CLOSE</button>
    </div>
  </div></div>
  <div id="nav" role="dialog" aria-label="Blocks"><h3>BLOCKS</h3><p>Jump to a block, or untick the ones you don’t want in the guide. Saved on this device only.</p><div id="navlist"></div><div id="navkeys"><b>▲▼</b> MOVE · <b>OK / ▶</b> JUMP · <b>SPACE</b> SHOW / HIDE · <b>◀</b> CLOSE</div></div>
  <div id="ticker" role="status" aria-live="polite"><span id="tk-label"></span><div id="tk-wrap"><span id="tk-text"></span></div></div>
  <div id="loading">Loading the guide…</div>
</div>
<iframe id="appframe" title="Weather TV" allow="autoplay; encrypted-media; fullscreen; geolocation; picture-in-picture" allowfullscreen></iframe>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const NCOL = 4;
  const stage = $('stage'), rowsEl = $('rows'), yt = $('yt'), player = $('player');

  let G = null, flat = [], sel = { r: -1, c: 0 }, off = 0, mode = 'guide', full = false;
  let skin = LS.get('wtvGuideSkin', 'wtv');                    // Weather TV colors by default; Classic is the option
  let hidden = new Set(LS.get('wtvGuideHidden', []));
  let panels = Object.assign({ side: true, info: true }, LS.get('wtvGuidePanels', {}));
  let loaded = { key: null, muted: true };
  let watched = null;            // { b, id, c } — the channel the player is on
  let engaged = false;           // false until the viewer picks or browses a channel (logo shows until then)
  function engage() { if (engaged) return; engaged = true; updateInfo(); schedulePreview(); }
  let watchBlock = null, tab = null, chasers = {}, map = null, marker = null, osdT = null, pvT = null;

  // ── Stage: a 1280×720 TV screen scaled to the window ──
  let scale = 1, stageX = 0, stageY = 0;
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    scale = s; stageX = Math.max(0, (innerWidth - 1280 * s) / 2); stageY = Math.max(0, (innerHeight - 720 * s) / 2);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.left = stageX + 'px';
    stage.style.top = stageY + 'px';
    if (typeof placeApp === 'function') placeApp();
  }
  addEventListener('resize', fit); fit();

  function applySkin() {
    document.body.className = skin;
    $('skinbtn').textContent = 'LOOK: ' + (skin === 'classic' ? 'CLASSIC' : 'WEATHER TV');
  }
  applySkin();

  function ago(iso) {
    if (!iso) return '';
    const m = (Date.now() - Date.parse(iso)) / 60000;
    if (!isFinite(m)) return '';
    if (m < 60) return Math.max(1, Math.round(m)) + 'm ago';
    if (m < 1440) return Math.round(m / 60) + 'h ago';
    return Math.round(m / 1440) + 'd ago';
  }
  function tick() {
    const t = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', second: '2-digit' });
    $('clock').textContent = t.replace(/ [AP]M$/, '');
    $('barclock').textContent = t.replace(/:\d\d (?=[AP]M)/, ' ');
  }
  setInterval(tick, 1000); tick();

  // ── Your temperature + place (from the place saved on Live Radar's forecast; this device only) ──
  async function loadWx() {
    let p = null;
    try { p = JSON.parse(localStorage.getItem('wtv-radar-place') || 'null'); } catch (e) {}
    if (!p || !isFinite(p.lat) || !isFinite(p.lon)) { $('wx').innerHTML = 'SET YOUR LOCATION ›'; return; }
    try {
      const j = await (await fetch('/api/forecast?lat=' + (+p.lat).toFixed(4) + '&lon=' + (+p.lon).toFixed(4) + (p.label ? '&name=' + encodeURIComponent(p.label) : ''), { cache: 'no-cache' })).json();
      const t = j && j.current && j.current.temperature_2m;
      const name = (p.label || (j.location && j.location.name) || '').split(',').slice(0, 2).join(',');
      $('wx').innerHTML = (isFinite(t) ? '<b>' + Math.round(t) + '°</b>' : '') + esc(name);
    } catch (e) { $('wx').textContent = (p.label || '').split(',')[0]; }
  }

  // ── Data ──
  async function load(first) {
    try {
      const r = await fetch('/api/guide', { cache: 'no-cache' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      G = await r.json();
      rebuild();
      $('loading').style.display = 'none';
    } catch (e) {
      if (first) $('loading').textContent = 'The guide could not load. Try again in a minute.';
    }
  }
  async function loadChasers() {
    try {
      const j = await (await fetch('/api/chasers')).json();
      const m = {};
      (j.chasers || []).forEach((c) => { if (c.channelId && isFinite(c.lat) && isFinite(c.lng)) m[c.channelId] = c; });
      chasers = m;
      if (mode === 'watch') renderSide(false);
    } catch (e) {}
  }

  // A hidden block's channels leave Live Now too (a channel only ever lives in one block)
  function visibleChannels(b) {
    const list = b.channels || [];
    return b.id === 'live' ? list.filter((ch) => !hidden.has(ch.home)) : list;
  }
  function rebuild() {
    const prev = flat[sel.r];
    const keep = prev && prev.ch ? { b: prev.b.id, id: prev.ch.id } : null;
    flat = [];
    G.blocks.forEach((b) => {
      const chans = visibleChannels(b);
      if (!chans.length) return;
      if (hidden.has(b.id) && b.id !== 'wtv') return;
      const bb = b.id === 'live' ? Object.assign({}, b, { label: 'LIVE NOW · ' + chans.length + (chans.length === 1 ? ' CHANNEL' : ' CHANNELS') }) : b;
      flat.push({ band: true, b: bb });
      chans.forEach((ch) => flat.push({ b: bb, ch }));
    });
    let r = keep ? flat.findIndex((it) => it.ch && it.b.id === keep.b && it.ch.id === keep.id) : -1;
    if (r < 0) r = flat.findIndex((it) => it.ch);
    sel.r = r;
    renderGrid();
    select(r, keep ? sel.c : 0, true);
  }

  // ── Grid ──
  function cellSub(it, c, k) {
    const ch = it.ch;
    if (ch.kind === 'forecast') return 'Opens your forecast';
    if (ch.kind === 'radar') return 'Opens Live Radar';
    if (ch.kind === 'wstar') return 'Opens the WeatherStar menu';
    if (ch.kind === 'list') return (ch.id === 'highlights' ? 'Clip ' + (k + 1) : (k + 1) + ' of ' + ch.cells.length);
    if (c.live) return 'Live now';
    return ago(c.at);
  }
  function rowHTML(it, i) {
    const ch = it.ch;
    let cells = '';
    for (let k = off; k < off + NCOL; k++) {
      const c = ch.cells[k];
      if (!c) {
        const msg = k === 0 ? (ch.needsFetch ? 'Loading playlist…' : 'No uploads found') : '';
        cells += '<div class="cell empty">' + esc(msg) + '</div>';
        continue;
      }
      const more = k === off + NCOL - 1 && ch.cells.length > k + 1 ? '  ››' : '';
      const isSel = i === sel.r && k === sel.c;
      cells += '<button type="button" class="cell' + (isSel ? ' sel' : '') + '" data-r="' + i + '" data-c="' + k + '">'
        + '<span class="l">' + (c.live ? '<i class="live">LIVE</i>' : '') + '<span class="t">' + esc(c.t) + '</span></span>'
        + '<span class="s">' + esc(cellSub(it, c, k) + more) + '</span></button>';
    }
    const code = ch.area && ch.area !== 'US' ? ' · ' + ch.area : '';   // country / state (a plain US says nothing)
    const nets = netsOf(ch);
    const badges = nets.slice(0, 2).map((n, j) => '<span class="nb n' + j + '" aria-hidden="true">' + (n.logo ? '<img src="' + esc(n.logo) + '" alt="">' : '<i>' + esc(n.name.slice(0, 4).toUpperCase()) + '</i>') + '</span>').join('');
    const tip = ch.name + (nets.length ? ' · ' + nets.map((n) => n.name).join(' & ') : '');
    return '<div class="row" id="r' + i + '"><button type="button" class="chan" data-chm="' + i + '" title="' + esc(tip) + '" aria-label="About ' + esc(tip) + '">' + badges + '<b>' + ch.n + '</b><span>' + esc(ch.call + code) + '</span></button>' + cells + '</div>';
  }
  function renderGrid() {
    rowsEl.innerHTML = flat.map((it, i) => it.band
      ? '<div class="band" id="r' + i + '"><span>' + esc(it.b.label) + '</span><span>' + esc(it.b.range) + '</span></div>'
      : rowHTML(it, i)).join('');
    $('h1').textContent = off === 0 ? 'ON NOW · NEWEST' : '‹‹‹ NEWER';
    keepVisible();
  }
  function keepVisible() {
    const el = $('r' + sel.r);
    if (!el || mode !== 'guide' || scrolling) return;              // don't yank the view while it's rolling
    const top = el.offsetTop - rowsEl.offsetTop, h = rowsEl.clientHeight;
    const want = flat[sel.r - 1] && flat[sel.r - 1].band ? top - 24 : top;
    if (want < rowsEl.scrollTop + 40) rowsEl.scrollTop = Math.max(0, want - 40);
    else if (top + el.offsetHeight > rowsEl.scrollTop + h - 40) rowsEl.scrollTop = top + el.offsetHeight - h + 40;
  }

  function isPage(ch) { return ch && (ch.kind === 'forecast' || ch.kind === 'radar' || ch.kind === 'wstar'); }   // channels that open a page
  function current() { const it = flat[sel.r]; return it && it.ch ? { it, ch: it.ch, c: it.ch.cells[sel.c] } : null; }

  function select(r, c, force) {
    const it = flat[r];
    if (!it || !it.ch) return;
    const n = it.ch.cells.length;
    c = Math.max(0, Math.min(c, Math.max(0, n - 1)));
    const prevOff = off;
    if (c < off) off = c;
    if (c > off + NCOL - 1) off = c - NCOL + 1;
    const old = rowsEl.querySelector('.cell.sel');
    sel = { r, c };
    if (off !== prevOff || force) renderGrid();
    else {
      if (old) old.classList.remove('sel');
      const btn = rowsEl.querySelector('.cell[data-r="' + r + '"][data-c="' + c + '"]');
      if (btn) btn.classList.add('sel');
      keepVisible();
    }
    if (it.ch.needsFetch && !it.ch._fetching) fetchPlaylist(it.ch);
    updateInfo();
    if (mode === 'guide') schedulePreview();
  }

  async function fetchPlaylist(ch) {
    ch._fetching = true;
    try {
      const j = await (await fetch('/api/yt/playlist/' + encodeURIComponent(ch.playlistId))).json();
      ch.cells = (j.items || []).map((it) => ({ v: it.snippet && it.snippet.resourceId && it.snippet.resourceId.videoId, t: (it.snippet && it.snippet.title) || '' })).filter((c) => c.v);
      ch.needsFetch = false;
      renderGrid(); updateInfo(); if (mode === 'guide') schedulePreview();
    } catch (e) { ch._fetching = false; }
  }

  // Networks a channel is in (badge, popup, info panel) and a creator's other channels
  function netsOf(ch) { const N = (G && G.networks) || {}; return (ch.nets || []).map((k) => N[k]).filter(Boolean); }
  function familyOf(it) {
    const f = it.ch.fam; if (!f) return [];
    const out = [], seen = new Set([it.ch.id]);
    flat.forEach((x, r) => { if (x.ch && x.ch.fam === f && !seen.has(x.ch.id) && x.b.id !== 'live') { seen.add(x.ch.id); out.push({ r, ch: x.ch }); } });
    return out;
  }
  function blockLabel(it) { return it.ch.block || it.b.label.replace(/ · .*$/, ''); }
  function describe(it, c, k) {
    const ch = it.ch;
    const nxt = ch.cells[k + 1];
    let status = '', next = nxt ? 'Next on this channel: ' + nxt.t : '', action = 'WATCH', live = false;
    if (ch.kind === 'forecast') { status = 'Opens your full forecast'; next = 'Hourly · 7-day · alerts · records'; action = 'OPEN FORECAST'; }
    else if (ch.kind === 'radar') { status = 'Opens Live Radar'; next = 'Radar · warnings · chasers on the map'; action = 'OPEN RADAR'; }
    else if (ch.kind === 'wstar') { status = 'Opens the WeatherStar menu'; next = 'Pick screens, music and look'; action = 'OPEN WEATHERSTAR'; }
    else if (ch.kind === 'list') { status = 'Plays straight through · ' + cellSub(it, c, k); }
    else if (c && c.live) { status = 'LIVE now'; live = true; }
    else if (c) { status = 'Uploaded ' + ago(c.at); }
    return { status, next, action, live };
  }
  function updateInfo() {
    if (!engaged) {
      $('i-block').textContent = 'Welcome to Weather TV';
      $('i-title').textContent = 'Live storm chasers, forecasters and radar';
      $('i-creator').textContent = 'Pick a channel to start watching';
      $('i-status').textContent = '▲▼ to browse · OK to watch · ☰ BLOCKS to jump';
      $('i-status').className = '';
      $('i-next').textContent = 'Or click any show in the guide below';
      $('i-go').textContent = 'OK · START';
      return;
    }
    const cur = current();
    if (!cur) return;
    const { it, ch, c } = cur;
    const d = describe(it, c, sel.c);
    $('i-block').textContent = blockLabel(it) + ' · Channel ' + ch.n + (ch.area && ch.area !== 'US' ? ' · ' + ch.area : '');
    $('i-title').textContent = c ? '“' + c.t + '”' : ch.name;
    const nets = netsOf(ch);
    $('i-creator').textContent = ch.name + (nets.length ? ' · ' + nets.map((n) => n.name).join(' & ') : '');
    $('i-status').textContent = d.status;
    $('i-status').className = d.live ? 'live' : '';
    $('i-next').textContent = d.next;
    $('i-go').textContent = 'OK · ' + d.action;
    $('pv-n').textContent = ch.n; $('pv-call').textContent = ch.call;
  }

  // ── Player: one iframe that moves between the guide's preview box and the watch frame ──
  function ytCmd(func, args) {
    try { yt.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args: args || [] }), '*'); } catch (e) {}
  }
  yt.addEventListener('load', () => {
    try {
      yt.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 'wtvguide', channel: 'widget' }), '*');
      ytCmd('addEventListener', ['onStateChange']);
    } catch (e) {}
    if (!loaded.muted) setTimeout(() => { ytCmd('unMute'); ytCmd('setVolume', [90]); }, 400);
  });
  let lastEnd = 0;
  addEventListener('message', (e) => {
    if (!/^https:\/\/www\.youtube(-nocookie)?\.com$/.test(e.origin)) return;
    let d; try { d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; } catch (x) { return; }
    if (!d) return;
    const ended = (d.event === 'onStateChange' && d.info === 0) || (d.event === 'infoDelivery' && d.info && d.info.playerState === 0);
    if (ended && Date.now() - lastEnd > 3000) { lastEnd = Date.now(); onEnded(); }
  });

  function keyOf(ch, c) { return c ? (c.v || ('live:' + (c.ch || ch.id))) : null; }
  function srcOf(ch, c, muted) {
    const q = 'autoplay=1&mute=' + (muted ? 1 : 0) + '&enablejsapi=1&playsinline=1&rel=0&origin=' + encodeURIComponent(location.origin);
    return c.v ? 'https://www.youtube.com/embed/' + encodeURIComponent(c.v) + '?' + q
               : 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(c.ch || ch.id) + '&' + q;
  }
  function play(ch, c, muted) {
    if (!c || isPage(ch)) { showSlate(ch); return; }
    const key = keyOf(ch, c);
    player.classList.remove('hide');
    $('slate').style.display = 'none';
    if (loaded.key === key) {
      if (loaded.muted !== muted) { ytCmd(muted ? 'mute' : 'unMute'); if (!muted) ytCmd('setVolume', [90]); ytCmd('playVideo'); loaded.muted = muted; }
      return;
    }
    loaded = { key, muted };
    yt.src = srcOf(ch, c, muted);
  }
  function stopPlayer() { loaded = { key: null, muted: true }; yt.src = 'about:blank'; player.classList.add('hide'); }
  // The Weather TV logo with radar pulses: before a channel is picked, and for
  // channels with nothing to preview (Forecast, WeatherStar, an empty channel)
  function showSlate(ch) {
    stopPlayer();
    $('slate').style.display = 'flex';
    $('sl-cap').innerHTML = ch ? '<b>' + esc(ch.n) + '</b><span>' + esc(ch.name) + '</span><small>'
      + (isPage(ch) ? 'Press OK to open' : 'Nothing to preview yet') + '</small>' : '';
    updateBar();
  }
  function schedulePreview() {
    clearTimeout(pvT);
    if (!engaged) { showSlate(null); return; }                    // first visit: logo until a channel is picked
    const cur = current();
    if (!cur) return;
    if (!cur.c || isPage(cur.ch)) { showSlate(cur.ch); return; }
    if (loaded.key === keyOf(cur.ch, cur.c)) return;   // keep what's playing (and its sound)
    pvT = setTimeout(() => { const now = current(); if (now && mode === 'guide') play(now.ch, now.c, true); }, 650);
  }

  // ── Layout: video, side panel and info bar, any of them minimized ──
  function layout() {
    const P = player.style;
    if (mode === 'guide') { P.left = '12px'; P.top = '12px'; P.width = '533px'; P.height = '300px'; return; }
    const tk = ticking ? 30 : 0;                                 // the warning ticker takes the bottom 30px
    if (full) { P.left = '0px'; P.top = '0px'; P.width = '1280px'; P.height = (720 - tk) + 'px'; return; }
    const side = panels.side, info = panels.info;
    const avail = 656 - tk;                                       // area above the bottom bar
    const W = side ? 880 : 1256, H = info ? avail - 148 : avail;
    let w = Math.min(W, Math.round(H * 16 / 9)), h = Math.round(w * 9 / 16);
    P.left = (12 + Math.round((W - w) / 2)) + 'px'; P.top = '12px'; P.width = w + 'px'; P.height = h + 'px';
    $('side').style.display = side ? 'flex' : 'none';
    $('side').style.height = H + 'px';
    $('banner').style.display = info ? 'flex' : 'none';
    $('banner').style.top = (12 + H + 8) + 'px';
    if (side && tab === 'MAP' && map) setTimeout(() => map.invalidateSize(), 400);
  }
  function setPanel(k, v) { panels[k] = v; LS.set('wtvGuidePanels', panels); layout(); updateBar(); }
  function updateBar() {
    const w = mode === 'watch' || mode === 'app';
    $('guidebtn').textContent = w ? 'GUIDE' : (watched ? '◀ BACK TO CH ' + watched.n : 'GUIDE');
    $('guidebtn').disabled = !w && !watched;
    $('guidebtn').style.opacity = !w && !watched ? '0.5' : '1';
    document.querySelectorAll('#bar [data-app]').forEach((b) => b.classList.toggle('on', mode === 'app' && b.dataset.app === app));
    $('r-info').hidden = !(w && !panels.info);
    $('r-side').hidden = !(w && !panels.side);
    $('fullbtn').hidden = mode !== 'watch';
  }

  // ── Pages that open above the bottom bar: Forecast, Live Radar, WeatherStar, About… ──
  const APPS = {
    radar: '/radar.html?embed=guide',
    forecast: '/radar.html?embed=guide&view=forecast',
    wstar: '/?ws=1&embed=guide',
    about: '/?about=1&embed=guide',
    getapp: '/?getapp=1&embed=guide',
    support: '/shop.html?embed=guide',
  };
  let app = null;
  function placeApp() {
    const f = $('appframe');
    if (!f || mode !== 'app') return;
    const h = 720 - 46 - (ticking ? 30 : 0);                     // everything above the bottom bar (and ticker)
    f.style.left = stageX + 'px'; f.style.top = stageY + 'px';
    f.style.width = Math.round(1280 * scale) + 'px'; f.style.height = Math.round(h * scale) + 'px';
  }
  function openApp(name) {
    if (!APPS[name]) return;
    closeNav(); clearTimeout(pvT);
    stopPlayer();                                                 // the channel stops; Back to Ch … returns to it
    $('chatf').src = 'about:blank';
    full = false; mode = 'app'; app = name;
    stage.classList.remove('guiding', 'watching', 'full'); stage.classList.add('apping');
    const f = $('appframe');
    if (f.dataset.app !== name) { f.dataset.app = name; f.src = APPS[name]; }
    f.style.display = 'block';
    placeApp(); updateBar();
    try { f.focus(); } catch (e) {}
  }
  function closeApp() {
    const f = $('appframe');
    f.style.display = 'none'; f.src = 'about:blank'; f.dataset.app = '';
    app = null; mode = 'guide';
    stage.classList.remove('apping'); stage.classList.add('guiding');
    if (watched) {
      const r = flat.findIndex((it) => it.ch && it.b.id === watched.b && it.ch.id === watched.id);
      if (r >= 0) { select(r, watched.c); return updateBar(); }
    }
    keepVisible(); updateInfo(); schedulePreview(); updateBar();
  }
  document.getElementById('bar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-app]'); if (!b) return;
    e.preventDefault();
    if (mode === 'app' && app === b.dataset.app) return;
    openApp(b.dataset.app);
  });
  // The radar's "Live Radar ✕" on phones asks to close: back to the guide
  addEventListener('message', (e) => { if (e.origin === location.origin && e.data && e.data.action === 'minimizeRadar' && mode === 'app') closeApp(); });

  // ── Guide ⇄ watching ──
  function activate() {
    closeNav();
    if (!engaged) { engage(); return; }                            // OK · START: begin previewing the highlighted channel
    const cur = current();
    if (!cur) return;
    if (cur.ch.kind === 'forecast') { openApp('forecast'); return; }
    if (cur.ch.kind === 'radar') { openApp('radar'); return; }
    if (cur.ch.kind === 'wstar') { openApp('wstar'); return; }
    if (!cur.c) return;
    clearTimeout(pvT);
    mode = 'watch';
    watchBlock = cur.it.b.id;
    watched = { b: cur.it.b.id, id: cur.ch.id, c: sel.c, n: cur.ch.n };
    stage.classList.remove('guiding'); stage.classList.add('watching');
    play(cur.ch, cur.c, false);
    tab = null;
    layout(); renderSide(true); renderBanner(); updateBar();
  }
  function openGuide() {
    if (mode === 'app') { closeApp(); return; }
    if (mode !== 'watch') return;
    mode = 'guide'; full = false;
    stage.classList.remove('watching', 'full'); stage.classList.add('guiding');
    $('chatf').src = 'about:blank';
    layout(); keepVisible(); updateInfo(); updateBar();
  }
  function backToWatched() {
    if (mode !== 'guide' || !watched) return;
    const r = flat.findIndex((it) => it.ch && it.b.id === watched.b && it.ch.id === watched.id);
    if (r < 0) return;
    select(r, watched.c);
    activate();
  }
  function surf(dir) {
    const rows = [];

  }
  function tickerAllows(ev, on) {
    if (EXCLUDED.has(ev)) return false;
    if (!TYPE_KEYS.length || !TYPE_KEYS.includes(ev)) return true;      // unknown types fail open, like the radar
    return on.has(ev) || BANNER_ALWAYS.has(ev);
  }
  function tkLocation() {
    // Your place (typed in the radar's top bar, the forecast or WeatherStar), else the alerts' location
    let p = null;
    try { p = JSON.parse(localStorage.getItem('wtv-radar-place') || 'null'); } catch (e) {}
    if (!p || !isFinite(p.lat)) { try { p = JSON.parse(localStorage.getItem('wtv-alert-location') || 'null'); } catch (e) {} }
    return p && isFinite(p.lat) && isFinite(p.lon) ? p : null;
  }
  async function loadTicker() {
    const p = bannerOn() ? tkLocation() : null;
    let alerts = [];
    if (p) {
      try {
        const j = await (await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert,update&point=' + (+p.lat).toFixed(4) + ',' + (+p.lon).toFixed(4), { headers: { Accept: 'application/geo+json' } })).json();
        const on = enabledTypes();
        alerts = (j.features || []).map((f) => f.properties || {}).filter((a) => a.event && !/^Test/i.test(a.event))
          .map((a) => Object.assign({}, a, { event: eventOf(a) })).filter((a) => tickerAllows(a.event, on));
      } catch (e) { return; }                                     // keep what's showing if NWS doesn't answer
    }
    const rank = (ev) => { const i = TK_ORDER.indexOf(ev); return i < 0 ? 99 : i; };
    alerts.sort((a, b) => rank(a.event) - rank(b.event));
    const was = ticking;
    ticking = alerts.length > 0;
    stage.classList.toggle('ticking', ticking);
    if (ticking) {
      const top = alerts[0];
      const col = (TK_COLOR.find(([re]) => re.test(top.event)) || [0, '#b7791f'])[1];
      $('ticker').style.setProperty('--tk', col);
      $('tk-label').textContent = (alerts.length > 1 ? alerts.length + ' ALERTS · ' : '') + top.event.toUpperCase();
      const parts = alerts.map((a) => a.event.toUpperCase() + (a.areaDesc ? ' · ' + a.areaDesc.split(';')[0].trim() : '') + ' — ' + (a.headline || '') + (a.expires ? ' · UNTIL ' + new Date(a.expires).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : ''));
      const key = parts.join('|');
      if (key !== tkKey) {
        tkKey = key;
        const txt = parts.join('   ●   ') + '   ●   ●   ●   ';
        const el = $('tk-text');
        el.textContent = txt + txt;                               // two copies: scrolling -50% loops seamlessly
        el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
        el.style.animationDuration = Math.max(18, Math.round(txt.length / 5)) + 's';
      }
    } else tkKey = '';
    if (was !== ticking) { layout(); placeApp(); if (mode === 'guide') keepVisible(); }
  }

  updateBar();
  loadTicker();
  setInterval(loadTicker, 2 * 60 * 1000);
  // Changed the Warning Banner or Alert Types on the radar in another tab? Follow it right away.
  addEventListener('storage', (e) => {
    if (/^wtv-(warning-banner|alert-types|alert-location|radar-place)/.test(e.key || '')) loadTicker();
    if (e.key === 'wtv-radar-place') loadWx();                    // a new ZIP in Radar, Forecast or WeatherStar: new temp + place
  });
  load(true);
  loadChasers();
  loadWx();
  setInterval(() => { if (mode === 'guide') load(false); }, 2 * 60 * 1000);
  setInterval(loadChasers, 60 * 1000);
  setInterval(loadWx, 15 * 60 * 1000);
})();
</script>
</body>
</html>
