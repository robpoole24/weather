<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Radar — Weather TV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0e14; --surface:#111820; --surface2:#1a2433;
    --accent:#00b4d8; --gold:#f4a261; --red:#e63946;
    --green:#2ec44a; --text:#e8f4fd; --muted:#7a9bb5;
    --border:rgba(0,180,216,0.2);
  }
  html,body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Barlow',sans-serif; overflow:hidden; }

  #radar-toolbar {
    position:absolute; top:0; left:0; right:0; z-index:1000;
    background:rgba(10,14,20,0.93); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:0.4rem;
    padding:0.35rem 0.65rem; flex-wrap:wrap; min-height:44px;
  }
  .radar-label {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--green); white-space:nowrap; display:flex; align-items:center; gap:0.4rem;
  }
  .sweep-icon {
    display:inline-block; width:12px; height:12px; border-radius:50%;
    border:2px solid var(--green); position:relative; flex-shrink:0;
  }
  .sweep-icon::before {
    content:''; position:absolute; top:50%; left:50%;
    width:0; height:0;
    border-left:5px solid var(--green);
    border-top:2px solid transparent; border-bottom:2px solid transparent;
    transform:translate(-1px,-50%) rotate(0deg); transform-origin:left center;
    animation:sweep 2s linear infinite;
  }
  @keyframes sweep { to { transform:translate(-1px,-50%) rotate(360deg); } }

  #zip-form { display:flex; gap:0.3rem; align-items:center; }
  #zip-input {
    background:var(--surface2); border:1px solid var(--border);
    color:var(--text); font-family:'Barlow',sans-serif; font-size:0.82rem;
    padding:0.28rem 0.55rem; border-radius:4px; width:150px; outline:none;
  }
  #zip-input::placeholder { color:var(--muted); }
  #zip-input:focus { border-color:var(--accent); }

  .tb-btn {
    font-family:'Barlow Condensed',sans-serif; font-weight:700;
    font-size:0.73rem; letter-spacing:0.08em; text-transform:uppercase;
    padding:0.28rem 0.6rem; border-radius:4px;
    border:1px solid var(--border); background:var(--surface2);
    color:var(--text); cursor:pointer; white-space:nowrap;
    transition:background 0.15s, border-color 0.15s;
  }
  .tb-btn:hover { background:var(--surface); border-color:var(--accent); color:var(--accent); }
  .tb-btn.on { background:var(--accent); border-color:var(--accent); color:#000; }
  .tb-btn.warn-on { background:rgba(230,57,70,0.2); border-color:var(--red); color:var(--red); }
  .tb-btn.view-on { background:var(--surface); border-color:var(--accent); color:var(--accent); }
  #location-btn { border-color:var(--green); color:var(--green); }
  #location-btn:hover { background:rgba(46,196,74,0.12); }
  .tb-div { width:1px; height:20px; background:var(--border); flex-shrink:0; }

  #anim-bar {
    display:flex; align-items:center; gap:0.35rem;
  }
  #anim-progress {
    font-family:'Barlow Condensed',sans-serif;
    font-size:1rem;
    font-weight:700;
    color:#ffffff;
    letter-spacing:0.06em;
    min-width:80px;
    text-shadow: 0 0 8px rgba(46,196,74,0.5);
  }
  #preload-status {
    font-family:'Barlow Condensed',sans-serif; font-size:0.68rem;
    color:var(--muted); letter-spacing:0.04em;
  }
  #alerts-status {
    font-size:0.72rem; color:var(--muted);
    font-family:'Barlow Condensed',sans-serif; letter-spacing:0.05em;
    margin-left:auto; white-space:nowrap;
  }

  #map { position:absolute; top:44px; left:0; right:0; bottom:0; }

  /* The radar layers sit inside the map pane — we control opacity via Leaflet */
  .radar-frame-layer { transition: opacity 0.2s ease; }

  #radar-legend {
    position:absolute; bottom:12px; left:12px; z-index:1000;
    background:rgba(10,14,20,0.88); border:1px solid var(--border);
    border-radius:6px; padding:0.45rem 0.65rem;
    font-family:'Barlow Condensed',sans-serif; font-size:0.7rem;
    letter-spacing:0.04em; color:var(--muted);
  }
  .leg-row { display:flex; align-items:center; gap:0.4rem; margin-bottom:0.18rem; }
  .leg-sw { width:16px; height:9px; border-radius:2px; flex-shrink:0; }

  #radar-loading {
    position:absolute; top:44px; left:0; right:0; bottom:0;
    background:var(--bg); z-index:500;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:1rem; transition:opacity 0.5s;
  }
  .spin { width:32px; height:32px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .load-txt { font-family:'Barlow Condensed',sans-serif; font-size:0.82rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }

  /* ── WARNING BANNER ── */
  #warning-banner {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 1001;
    border-top: 2px solid var(--banner-color, #ff0000);
    background: color-mix(in srgb, var(--banner-color, #ff0000) 15%, #0a0e14);
    animation: bannerPulse 2s ease-in-out infinite;
  }
  @keyframes bannerPulse {
    0%, 100% { border-top-color: var(--banner-color, #ff0000); }
    50% { border-top-color: color-mix(in srgb, var(--banner-color, #ff0000) 60%, white); }
  }
  #warning-banner-inner {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.75rem;
    min-height: 38px;
    overflow: hidden;
  }
  #warning-icon {
    font-size: 1.1rem;
    flex-shrink: 0;
    animation: iconPulse 1s ease-in-out infinite;
  }
  @keyframes iconPulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  #warning-scroll-wrap {
    flex: 1;
    overflow: hidden;
    position: relative;
  }
  #warning-scroll-text {
    display: inline-block;
    white-space: nowrap;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: white;
    text-transform: uppercase;
    animation: scrollText 30s linear infinite;
    padding-left: 100%;
  }
  @keyframes scrollText {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-200%); }
  }
  #warning-close {
    flex-shrink: 0;
    background: none;
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 0.75rem;
    width: 22px; height: 22px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0.7;
    transition: opacity 0.15s;
  }
  #warning-close:hover { opacity: 1; }

  /* Shrink map to make room for banner */
  #map.banner-visible { bottom: 38px; }

  .leaflet-tile-pane { filter:brightness(0.82) saturate(0.65); }
  .leaflet-popup-content-wrapper { background:#111820; color:#e8f4fd; border:1px solid rgba(0,180,216,0.3); border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,0.5); }
  .leaflet-popup-tip { background:#111820; }
  .leaflet-control-zoom a { background:#111820 !important; color:#e8f4fd !important; border-color:rgba(0,180,216,0.3) !important; }
  .leaflet-control-zoom a:hover { background:#1a2433 !important; color:#00b4d8 !important; }
  .leaflet-control-attribution { background:rgba(10,14,20,0.7) !important; color:#7a9bb5 !important; font-size:9px !important; }
  .leaflet-control-attribution a { color:#00b4d8 !important; }
  .alert-popup { font-family:'Barlow',sans-serif; font-size:0.8rem; max-width:240px; line-height:1.5; }
  .alert-popup .ev { font-family:'Barlow Condensed',sans-serif; font-size:1rem; letter-spacing:0.05em; text-transform:uppercase; font-weight:700; }
  .alert-popup .exp { color:#7a9bb5; font-size:0.72rem; margin-top:4px; }
</style>
</head>
<body>

<div id="radar-toolbar">
  <div class="radar-label"><span class="sweep-icon"></span>Live Radar</div>
  <div class="tb-div"></div>

  <form id="zip-form" onsubmit="searchLocation(event)">
    <input id="zip-input" type="text" placeholder="Zip or city..." autocomplete="off" aria-label="Search location"/>
    <button type="submit" class="tb-btn">Go</button>
  </form>
  <button class="tb-btn" id="location-btn" onclick="goToMyLocation()">📍 My Location</button>

  <div class="tb-div"></div>
  <button class="tb-btn on"      id="btn-radar"  onclick="toggleRadar()">🌧 Radar</button>
  <button class="tb-btn warn-on" id="btn-alerts" onclick="toggleAlerts()">⚠️ Alerts</button>
  <div class="tb-div"></div>

  <div id="anim-bar">
    <button class="tb-btn" id="btn-play" onclick="togglePlay()">▶ Play</button>
    <button class="tb-btn" onclick="stepFrame(-1)" title="Previous frame">◀</button>
    <button class="tb-btn" onclick="stepFrame(1)"  title="Next frame">▶</button>
    <span id="anim-progress">Loading...</span>
    <span id="preload-status"></span>
  </div>

  <div class="tb-div"></div>
  <button class="tb-btn" id="v-local"    onclick="setView('local')">Local</button>
  <button class="tb-btn" id="v-regional" onclick="setView('regional')">Regional</button>
  <button class="tb-btn view-on" id="v-national" onclick="setView('national')">National</button>

  <span id="alerts-status"></span>
</div>

<div id="map"></div>

<!-- Active warning banner — shown when user location is inside an alert zone -->
<div id="warning-banner" style="display:none;">
  <div id="warning-banner-inner">
    <span id="warning-icon">⚠️</span>
    <div id="warning-scroll-wrap">
      <div id="warning-scroll-text"></div>
    </div>
    <button id="warning-close" onclick="dismissBanner()" title="Dismiss">✕</button>
  </div>
</div>

<div id="radar-legend">
  <div class="leg-row"><div class="leg-sw" style="background:#ff0000"></div>Tornado Warning</div>
  <div class="leg-row"><div class="leg-sw" style="background:#ff8c00"></div>Severe T-Storm Warning</div>
  <div class="leg-row"><div class="leg-sw" style="background:#ffff00;border:1px solid #888"></div>Tornado Watch</div>
  <div class="leg-row"><div class="leg-sw" style="background:#db8d00"></div>Severe T-Storm Watch</div>
  <div class="leg-row"><div class="leg-sw" style="background:#00ff00"></div>Flash Flood Warning</div>
  <div class="leg-row"><div class="leg-sw" style="background:#2ec44a;opacity:0.6"></div>Other Advisory</div>
</div>

<div id="radar-loading"><div class="spin"></div><div class="load-txt">Loading radar...</div></div>

<script>
// ── ALERT STYLES ─────────────────────────────────────────────────────────────
const ALERT_STYLE = {
  'Tornado Warning':                    { color:'#ff0000', fill:'#ff0000', fillOpacity:0.4,  weight:2   },
  'Tornado Watch':                      { color:'#ffff00', fill:'#ffff00', fillOpacity:0.2,  weight:1.5 },
  'Severe Thunderstorm Warning':        { color:'#ff8c00', fill:'#ff8c00', fillOpacity:0.35, weight:2   },
  'Severe Thunderstorm Watch':          { color:'#db8d00', fill:'#db8d00', fillOpacity:0.2,  weight:1.5 },
  'Flash Flood Warning':                { color:'#00ff00', fill:'#00ff00', fillOpacity:0.35, weight:2   },
  'Flash Flood Watch':                  { color:'#2e8b57', fill:'#2e8b57', fillOpacity:0.2,  weight:1.5 },
  'Flash Flood Emergency':              { color:'#00ff00', fill:'#00ff00', fillOpacity:0.5,  weight:2.5 },
  'Flood Warning':                      { color:'#00ff00', fill:'#00ff00', fillOpacity:0.25, weight:1.5 },
  'Flood Watch':                        { color:'#2e8b57', fill:'#2e8b57', fillOpacity:0.15, weight:1   },
  'Flood Advisory':                     { color:'#2e8b57', fill:'#2e8b57', fillOpacity:0.12, weight:1   },
  'Extreme Wind Warning':               { color:'#ff4500', fill:'#ff4500', fillOpacity:0.35, weight:2   },
  'Winter Storm Warning':               { color:'#9370db', fill:'#9370db', fillOpacity:0.25, weight:1.5 },
  'Winter Storm Watch':                 { color:'#4169e1', fill:'#4169e1', fillOpacity:0.2,  weight:1.5 },
  'Winter Weather Advisory':            { color:'#7b68ee', fill:'#7b68ee', fillOpacity:0.15, weight:1   },
  'Blizzard Warning':                   { color:'#ff69b4', fill:'#ff69b4', fillOpacity:0.3,  weight:2   },
  'Ice Storm Warning':                  { color:'#8b008b', fill:'#8b008b', fillOpacity:0.25, weight:1.5 },
  'Freezing Rain Advisory':             { color:'#da70d6', fill:'#da70d6', fillOpacity:0.15, weight:1   },
  'Wind Advisory':                      { color:'#d2b48c', fill:'#d2b48c', fillOpacity:0.15, weight:1   },
  'High Wind Warning':                  { color:'#daa520', fill:'#daa520', fillOpacity:0.2,  weight:1.5 },
  'High Wind Watch':                    { color:'#b8860b', fill:'#b8860b', fillOpacity:0.15, weight:1   },
  'Dense Fog Advisory':                 { color:'#708090', fill:'#708090', fillOpacity:0.2,  weight:1   },
  'Heat Advisory':                      { color:'#ff7f50', fill:'#ff7f50', fillOpacity:0.15, weight:1   },
  'Excessive Heat Warning':             { color:'#c71585', fill:'#c71585', fillOpacity:0.25, weight:1.5 },
  'Excessive Heat Watch':               { color:'#800000', fill:'#800000', fillOpacity:0.2,  weight:1   },
  'Fire Weather Watch':                 { color:'#ffd700', fill:'#ffd700', fillOpacity:0.2,  weight:1   },
  'Red Flag Warning':                   { color:'#ff1493', fill:'#ff1493', fillOpacity:0.25, weight:1.5 },
  'Dust Storm Warning':                 { color:'#ffe4b5', fill:'#ffe4b5', fillOpacity:0.3,  weight:1.5 },
  'Dust Advisory':                      { color:'#d2b48c', fill:'#d2b48c', fillOpacity:0.15, weight:1   },
  'Special Marine Warning':             { color:'#ffa500', fill:'#ffa500', fillOpacity:0.2,  weight:1   },
  'Special Weather Statement':          { color:'#a0a0a0', fill:'#a0a0a0', fillOpacity:0.1,  weight:1   },
  'Hazardous Weather Outlook':          { color:'#a0a0a0', fill:'#a0a0a0', fillOpacity:0.08, weight:0.5 },
};
const DEFAULT_STYLE = { color:'#2ec44a', fill:'#2ec44a', fillOpacity:0.12, weight:1 };

// ── RADAR FRAME CONFIG ───────────────────────────────────────────────────────
// Iowa Mesonet tile cache reliably goes back ~55 minutes in 5-min steps
function buildFrameList() {
  const frames = [];
  const now = new Date();
  for (let i = 55; i >= 5; i -= 5) {
    const frameTime = new Date(now.getTime() - i * 60000);
    const label = frameTime.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
    frames.push({ ts: `900913-m${String(i).padStart(2,'0')}m`, label });
  }
  const nowLabel = now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });
  frames.push({ ts: '900913', label: nowLabel });
  return frames;
}
const FRAMES = buildFrameList(); // 12 frames, ~55 min

// ── MAP INIT ─────────────────────────────────────────────────────────────────
const map = L.map('map', { center:[39.5,-98.35], zoom:5 });

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; <a href="https://carto.com/">CartoDB</a> &copy; <a href="https://openstreetmap.org">OSM</a>',
  subdomains:'abcd', maxZoom:19
}).addTo(map);

// ── SMOOTH ANIMATION ENGINE ──────────────────────────────────────────────────
// Key technique: all frame layers exist on the map simultaneously,
// but all are opacity:0 except the active one. This keeps tiles loaded
// in the browser cache so switching is instant with no flash.

const frameLayers = FRAMES.map((f, idx) => {
  const layer = L.tileLayer(
    `https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-${f.ts}/{z}/{x}/{y}.png`,
    {
      opacity: idx === FRAMES.length - 1 ? 0.72 : 0, // only show last (current) frame
      attribution: idx === 0 ? 'Radar: <a href="https://mesonet.agron.iastate.edu/">IEM/NEXRAD</a>' : '',
      tileSize: 256,
      zIndex: 200 + idx,
      crossOrigin: true,
    }
  );
  return layer;
});

// Add ALL layers to map (they're invisible until activated)
frameLayers.forEach(l => l.addTo(map));

let currentFrame = FRAMES.length - 1;
let radarVisible = true;
let isPlaying = false;
let playTimer = null;
let preloadCount = 0;
let userLat = null, userLng = null;
let alertsVisible = true;
let alertsLayer = L.layerGroup().addTo(map);

// Track tile load progress for preload indicator
frameLayers.forEach((layer, idx) => {
  layer.on('load', () => {
    preloadCount++;
    const pct = Math.round((preloadCount / FRAMES.length) * 100);
    const el = document.getElementById('preload-status');
    if (el && pct < 100) el.textContent = `Loading ${pct}%`;
    else if (el) el.textContent = '';
  });
});

updateFrameLabel();

// Hide loading overlay
setTimeout(() => {
  const el = document.getElementById('radar-loading');
  if (el) { el.style.opacity='0'; setTimeout(()=>el.remove(),500); }
}, 2000);

// ── FRAME SWITCHING (smooth — just swap opacity) ──────────────────────────────
function showFrame(idx) {
  if (!radarVisible) return;
  // Fade out current, fade in new
  frameLayers[currentFrame].setOpacity(0);
  frameLayers[idx].setOpacity(0.72);
  currentFrame = idx;
  updateFrameLabel();
}

function updateFrameLabel() {
  const f = FRAMES[currentFrame];
  document.getElementById('anim-progress').textContent = f.label;
}

function stepFrame(dir) {
  let next = currentFrame + dir;
  if (next < 0) next = FRAMES.length - 1;
  if (next >= FRAMES.length) next = 0;
  showFrame(next);
}

function togglePlay() {
  isPlaying = !isPlaying;
  const btn = document.getElementById('btn-play');
  if (isPlaying) {
    btn.textContent = '⏸ Pause';
    btn.classList.add('on');
    // Pause briefly on the last (current) frame before looping
    function advance() {
      let next = currentFrame + 1;
      if (next >= FRAMES.length) {
        next = 0;
        // Pause 1.5s on "Now" before restarting loop
        showFrame(FRAMES.length - 1);
        playTimer = setTimeout(() => {
          if (isPlaying) { showFrame(0); playTimer = setTimeout(advance, 450); }
        }, 1500);
        return;
      }
      showFrame(next);
      playTimer = setTimeout(advance, 450); // 450ms per frame
    }
    advance();
  } else {
    btn.textContent = '▶ Play';
    btn.classList.remove('on');
    clearTimeout(playTimer);
  }
}

// ── RADAR TOGGLE ─────────────────────────────────────────────────────────────
function toggleRadar() {
  radarVisible = !radarVisible;
  document.getElementById('btn-radar').className = 'tb-btn' + (radarVisible ? ' on' : '');
  if (radarVisible) {
    frameLayers[currentFrame].setOpacity(0.72);
  } else {
    frameLayers.forEach(l => l.setOpacity(0));
  }
}

// ── ALERTS ───────────────────────────────────────────────────────────────────
function toggleAlerts() {
  alertsVisible = !alertsVisible;
  document.getElementById('btn-alerts').className = 'tb-btn' + (alertsVisible ? ' warn-on' : '');
  if (alertsVisible) { map.addLayer(alertsLayer); loadAlerts(); }
  else map.removeLayer(alertsLayer);
}

async function loadAlerts() {
  if (!alertsVisible) return;
  const status = document.getElementById('alerts-status');
  status.textContent = 'Updating alerts...';
  try {
    const res = await fetch(
      'https://api.weather.gov/alerts/active?status=actual&message_type=alert&region_type=land',
      { headers:{ 'Accept':'application/geo+json' } }
    );
    const data = await res.json();
    alertsLayer.clearLayers();
    activeBannerAlerts = [];
    let count = 0;

    (data.features || []).forEach(feature => {
      if (!feature.geometry) return;
      const props = feature.properties;
      const event = props.event || 'Advisory';
      const s = ALERT_STYLE[event] || DEFAULT_STYLE;
      const layer = L.geoJSON(feature.geometry, {
        style:{ color:s.color, fillColor:s.fill, fillOpacity:s.fillOpacity, weight:s.weight, opacity:0.9 },
        onEachFeature: (feat, lyr) => {
          // Desktop hover highlight
          lyr.on('mouseover', function(e) {
            this.setStyle({ fillOpacity: Math.min(s.fillOpacity + 0.2, 0.7), weight: s.weight + 1 });
            this.openPopup(e.latlng);
          });
          lyr.on('mouseout', function() {
            this.setStyle({ fillOpacity: s.fillOpacity, weight: s.weight });
          });
        }
      });
      const expires = props.expires
        ? new Date(props.expires).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
        : 'Unknown';
      const fullText = [props.description, props.instruction]
        .filter(Boolean).join('\n\n').replace(/\*/g,'').trim();
      layer.bindPopup(`
        <div class="alert-popup">
          <div class="ev" style="color:${s.color}">${event}</div>
          <div style="margin-top:4px;font-weight:600">${props.headline || event}</div>
          <div style="margin-top:4px;font-size:0.75rem;color:#7a9bb5">${props.areaDesc||''}</div>
          <div class="exp">Expires: ${expires}</div>
          ${fullText ? `
          <div style="margin-top:8px;max-height:160px;overflow-y:auto;
            border-top:1px solid rgba(255,255,255,0.1);padding-top:6px;
            font-size:0.75rem;line-height:1.6;color:#c8dde8;
            scrollbar-width:thin;scrollbar-color:#7a9bb5 transparent;">
            ${fullText.replace(/\n/g,'<br>')}
          </div>` : ''}
        </div>
      `, { maxWidth: 300, maxHeight: 350 });
      alertsLayer.addLayer(layer);
      count++;

      // Check if user is inside this alert polygon
      if (userLat && userLng && !bannerDismissed) {
        if (pointInPolygon(userLat, userLng, feature.geometry)) {
          activeBannerAlerts.push({
            event,
            headline: props.headline || '',
            areaDesc: props.areaDesc || '',
            description: props.description || '',
            instruction: props.instruction || '',
          });
        }
      }
    });

    // Show or hide banner based on whether user is in a zone
    if (activeBannerAlerts.length > 0 && !bannerDismissed) {
      showBanner(activeBannerAlerts);
    } else if (activeBannerAlerts.length === 0) {
      bannerDismissed = false; // reset dismiss if alerts cleared
      hideBanner();
    }

    const now = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    status.textContent = count > 0
      ? `${count} active alert${count!==1?'s':''} · ${now}`
      : `No active alerts · ${now}`;
  } catch(e) {
    status.textContent = 'Alerts unavailable';
  }
}

// ── WARNING BANNER ───────────────────────────────────────────────────────────
// Priority order — highest danger shown first
const ALERT_PRIORITY = [
  'Tornado Warning','Flash Flood Emergency','Extreme Wind Warning',
  'Severe Thunderstorm Warning','Flash Flood Warning','Flood Warning',
  'Tornado Watch','Severe Thunderstorm Watch','Flash Flood Watch',
  'Flood Watch','Winter Storm Warning','Blizzard Warning','Ice Storm Warning',
  'High Wind Warning','Red Flag Warning','Excessive Heat Warning',
  'Special Weather Statement','Special Marine Warning',
];

let bannerDismissed = false;
let activeBannerAlerts = [];

function dismissBanner() {
  bannerDismissed = true;
  document.getElementById('warning-banner').style.display = 'none';
  document.getElementById('map').classList.remove('banner-visible');
}

function showBanner(alerts) {
  if (bannerDismissed || !alerts.length) return;
  const banner = document.getElementById('warning-banner');
  const scrollText = document.getElementById('warning-scroll-text');
  const icon = document.getElementById('warning-icon');

  // Sort by priority
  alerts.sort((a, b) => {
    const ai = ALERT_PRIORITY.indexOf(a.event);
    const bi = ALERT_PRIORITY.indexOf(b.event);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });

  const top = alerts[0];
  const s = ALERT_STYLE[top.event] || DEFAULT_STYLE;

  // Set banner color
  banner.style.setProperty('--banner-color', s.color);

  // Set icon based on event type
  if (top.event.includes('Tornado')) icon.textContent = '🌪️';
  else if (top.event.includes('Thunder')) icon.textContent = '⛈️';
  else if (top.event.includes('Flood')) icon.textContent = '🌊';
  else if (top.event.includes('Wind')) icon.textContent = '💨';
  else if (top.event.includes('Winter') || top.event.includes('Blizzard') || top.event.includes('Ice')) icon.textContent = '❄️';
  else if (top.event.includes('Heat')) icon.textContent = '🌡️';
  else if (top.event.includes('Fire')) icon.textContent = '🔥';
  else icon.textContent = '⚠️';

  // Build scroll text — all active alerts separated by bullets
  const parts = alerts.map(a => {
    // Pull NWS short description — use headline, fall back to event name
    const headline = a.headline || a.event;
    const area = a.areaDesc ? ` · ${a.areaDesc.split(';')[0].trim()}` : '';
    return `${a.event.toUpperCase()}${area} — ${headline}`;
  });
  // Duplicate text so scroll feels continuous
  const fullText = parts.join('   ●   ') + '   ●   ' + parts.join('   ●   ');
  scrollText.textContent = fullText;

  // Adjust scroll speed based on text length
  const duration = Math.max(20, parts.join('').length * 0.12);
  scrollText.style.animationDuration = duration + 's';

  banner.style.display = 'block';
  document.getElementById('map').classList.add('banner-visible');
  map.invalidateSize();
}

function hideBanner() {
  document.getElementById('warning-banner').style.display = 'none';
  document.getElementById('map').classList.remove('banner-visible');
  map.invalidateSize();
}

// Point-in-polygon check using ray casting
function pointInPolygon(lat, lng, geometry) {
  if (!geometry) return false;
  try {
    const coords = geometry.type === 'Polygon'
      ? [geometry.coordinates]
      : geometry.coordinates; // MultiPolygon

    for (const poly of coords) {
      const ring = Array.isArray(poly[0][0]) ? poly[0] : poly;
      let inside = false;
      const x = lng, y = lat;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        const intersect = ((yi > y) !== (yj > y)) &&
          (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
        if (intersect) inside = !inside;
      }
      if (inside) return true;
    }
  } catch(e) {}
  return false;
}

loadAlerts();
setInterval(loadAlerts, 120000);

// ── GEOLOCATION ──────────────────────────────────────────────────────────────
function goToMyLocation() {
  if (!navigator.geolocation) return;
  document.getElementById('alerts-status').textContent = 'Finding location...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude; userLng = pos.coords.longitude;
      map.setView([userLat, userLng], 8);
      document.getElementById('alerts-status').textContent = '';
      updateViewButtons('local');
    },
    () => { document.getElementById('alerts-status').textContent = 'Location unavailable'; },
    { timeout:8000 }
  );
}

// ── LOCATION SEARCH ──────────────────────────────────────────────────────────
let searchMarker = null;

async function searchLocation(e) {
  e.preventDefault();
  const q = document.getElementById('zip-input').value.trim();
  if (!q) return;
  document.getElementById('alerts-status').textContent = 'Searching...';
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=us&format=json&limit=1`,
      { headers:{'Accept-Language':'en'} }
    );
    const data = await res.json();
    if (data && data.length > 0) {
      userLat = parseFloat(data[0].lat); userLng = parseFloat(data[0].lon);
      const placeName = data[0].display_name.split(',').slice(0,2).join(',').trim();

      // Remove previous search marker
      if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }

      // Add pin marker
      searchMarker = L.marker([userLat, userLng], {
        icon: L.divIcon({
          className: '',
          html: `<div style="
            width:14px; height:14px; border-radius:50%;
            background:#f4a261; border:2px solid #fff;
            box-shadow:0 0 8px rgba(244,162,97,0.8);
            margin-top:-7px; margin-left:-7px;
          "></div>`,
          iconSize: [14, 14],
          iconAnchor: [7, 7],
        })
      }).addTo(map);
      searchMarker.bindPopup(`<div style="font-family:'Barlow Condensed',sans-serif;font-size:0.9rem;color:#e8f4fd">${placeName}</div>`).openPopup();

      // Zoom to zoom level 10 for city/zip — tight enough to see local area
      map.setView([userLat, userLng], 10);
      document.getElementById('alerts-status').textContent = placeName;
      document.getElementById('zip-input').value = '';
      updateViewButtons('local');
    } else {
      document.getElementById('alerts-status').textContent = 'Not found';
    }
  } catch {
    document.getElementById('alerts-status').textContent = 'Search unavailable';
  }
}

// ── VIEW PRESETS ─────────────────────────────────────────────────────────────
function setView(mode) {
  updateViewButtons(mode);
  const center = (userLat && userLng) ? [userLat, userLng] : [39.5, -98.35];
  if (mode === 'local')    map.setView(center, 8);
  if (mode === 'regional') map.setView(center, 6);
  if (mode === 'national') map.setView([39.5,-98.35], 5);
}

function updateViewButtons(active) {
  ['local','regional','national'].forEach(v => {
    document.getElementById('v-' + v).className = 'tb-btn' + (v === active ? ' view-on' : '');
  });
}

// ── FCM TOKEN REGISTRATION ───────────────────────────────────────────────────
// The Android app injects the FCM token into the WebView via a JS interface.
// We listen for it and register it with our server along with the user's location.
let fcmToken = null;

// Called by the Android WebView bridge when FCM token is available
window.onFcmToken = function(token) {
  fcmToken = token;
  if (userLat && userLng) registerFcmToken();
};

async function registerFcmToken() {
  if (!fcmToken || !userLat || !userLng) return;
  try {
    const res = await fetch('/api/radar/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: fcmToken, lat: userLat, lng: userLng }),
    });
    const data = await res.json();
    if (data.success) {
      console.log('[Radar] Registered for alerts in zone:', data.label);
    }
  } catch(e) {
    console.warn('[Radar] FCM registration failed:', e.message);
  }
}

// ── AUTO GEOLOCATE ON LOAD ───────────────────────────────────────────────────
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude; userLng = pos.coords.longitude;
      map.setView([userLat, userLng], 8);
      updateViewButtons('local');
      loadAlerts();
      registerFcmToken(); // register now that we have location
    },
    () => {},
    { timeout:6000 }
  );
}
