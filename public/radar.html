<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Radar — Weather TV</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0e14;
    --surface: #111820;
    --surface2: #1a2433;
    --accent: #00b4d8;
    --gold: #f4a261;
    --red: #e63946;
    --green: #2ec44a;
    --text: #e8f4fd;
    --muted: #7a9bb5;
    --border: rgba(0,180,216,0.2);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    overflow: hidden;
  }

  /* ── TOOLBAR ── */
  #radar-toolbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(10,14,20,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.4rem 0.75rem;
    flex-wrap: wrap;
    min-height: 44px;
  }

  .radar-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .radar-sweep-icon {
    display: inline-block;
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid var(--green);
    position: relative;
    flex-shrink: 0;
  }
  .radar-sweep-icon::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    border-left: 5px solid var(--green);
    border-top: 2px solid transparent;
    border-bottom: 2px solid transparent;
    transform: translate(-1px, -50%) rotate(0deg);
    transform-origin: left center;
    animation: sweep 2s linear infinite;
  }
  @keyframes sweep {
    to { transform: translate(-1px, -50%) rotate(360deg); }
  }

  /* Search */
  #zip-form {
    display: flex;
    gap: 0.3rem;
    align-items: center;
  }

  #zip-input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.82rem;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    width: 160px;
    outline: none;
  }
  #zip-input::placeholder { color: var(--muted); }
  #zip-input:focus { border-color: var(--accent); }

  .tb-btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 0.3rem 0.7rem;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .tb-btn:hover { background: var(--surface); border-color: var(--accent); color: var(--accent); }
  .tb-btn.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .tb-btn.warn-active { background: rgba(230,57,70,0.2); border-color: var(--red); color: var(--red); }

  .tb-divider {
    width: 1px; height: 20px;
    background: var(--border);
    flex-shrink: 0;
  }

  #location-btn {
    border-color: var(--green);
    color: var(--green);
  }
  #location-btn:hover { background: rgba(46,196,74,0.15); }

  #alerts-status {
    font-size: 0.72rem;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 0.05em;
    margin-left: auto;
  }

  /* ── MAP ── */
  #map {
    position: absolute;
    top: 44px; left: 0; right: 0; bottom: 0;
  }

  /* ── ALERT POPUP ── */
  .alert-popup {
    font-family: 'Barlow', sans-serif;
    font-size: 0.82rem;
    max-width: 260px;
    line-height: 1.5;
  }
  .alert-popup strong {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .alert-popup .alert-event { color: #e63946; font-weight: 700; }
  .alert-popup .alert-expires { color: #7a9bb5; font-size: 0.75rem; margin-top: 4px; }

  /* ── LEGEND ── */
  #radar-legend {
    position: absolute;
    bottom: 12px; left: 12px;
    z-index: 1000;
    background: rgba(10,14,20,0.88);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.5rem 0.75rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .legend-row { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.2rem; }
  .legend-swatch { width: 16px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* ── LOADING OVERLAY ── */
  #radar-loading {
    position: absolute;
    top: 44px; left: 0; right: 0; bottom: 0;
    background: var(--bg);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 1rem;
    transition: opacity 0.5s;
  }
  .loading-spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Leaflet dark theme overrides */
  .leaflet-tile-pane { filter: brightness(0.85) saturate(0.7); }
  .leaflet-popup-content-wrapper {
    background: #111820;
    color: #e8f4fd;
    border: 1px solid rgba(0,180,216,0.3);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .leaflet-popup-tip { background: #111820; }
  .leaflet-control-zoom a {
    background: #111820 !important;
    color: #e8f4fd !important;
    border-color: rgba(0,180,216,0.3) !important;
  }
  .leaflet-control-zoom a:hover { background: #1a2433 !important; color: #00b4d8 !important; }
  .leaflet-control-attribution { background: rgba(10,14,20,0.7) !important; color: #7a9bb5 !important; }
  .leaflet-control-attribution a { color: #00b4d8 !important; }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="radar-toolbar">
  <div class="radar-label">
    <span class="radar-sweep-icon"></span>
    Live Radar
  </div>

  <div class="tb-divider"></div>

  <form id="zip-form" onsubmit="searchLocation(event)">
    <input id="zip-input" type="text" placeholder="Zip code or city..." autocomplete="off" aria-label="Search by zip or city"/>
    <button type="submit" class="tb-btn">Go</button>
  </form>

  <button class="tb-btn" id="location-btn" onclick="goToMyLocation()" title="Go to my location">📍 My Location</button>

  <div class="tb-divider"></div>

  <button class="tb-btn active" id="toggle-radar-btn" onclick="toggleRadarLayer()" title="Toggle radar overlay">🌧 Radar</button>
  <button class="tb-btn warn-active" id="toggle-alerts-btn" onclick="toggleAlertsLayer()" title="Toggle NWS watches & warnings">⚠️ Watches/Warnings</button>

  <div class="tb-divider"></div>

  <button class="tb-btn" onclick="setView('local')" id="view-local">Local</button>
  <button class="tb-btn" onclick="setView('regional')" id="view-regional">Regional</button>
  <button class="tb-btn" onclick="setView('national')" id="view-national">National</button>

  <span id="alerts-status"></span>
</div>

<!-- Map -->
<div id="map"></div>

<!-- Legend -->
<div id="radar-legend">
  <div class="legend-row"><div class="legend-swatch" style="background:#ff0000"></div>Tornado Warning</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#ff8c00"></div>Severe T-Storm Warning</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#ffff00"></div>Tornado Watch</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#db8d00"></div>Severe T-Storm Watch</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#00ff00"></div>Flash Flood Warning</div>
  <div class="legend-row"><div class="legend-swatch" style="background:#2ec44a;opacity:0.5"></div>Other Advisory</div>
</div>

<!-- Loading overlay -->
<div id="radar-loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading radar...</div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
const DEFAULT_LAT = 39.5;
const DEFAULT_LNG = -98.35;
const DEFAULT_ZOOM = 5; // national view
const LOCAL_ZOOM   = 8;
const REGIONAL_ZOOM = 6;
const ALERTS_REFRESH_MS = 120000; // 2 min

// Alert color map by NWS event type
const ALERT_COLORS = {
  'Tornado Warning':            { fill: '#ff0000', opacity: 0.35 },
  'Severe Thunderstorm Warning':{ fill: '#ff8c00', opacity: 0.3  },
  'Tornado Watch':              { fill: '#ffff00', opacity: 0.2  },
  'Severe Thunderstorm Watch':  { fill: '#db8d00', opacity: 0.2  },
  'Flash Flood Warning':        { fill: '#00ff00', opacity: 0.3  },
  'Flash Flood Watch':          { fill: '#00aa00', opacity: 0.2  },
  'Special Weather Statement':  { fill: '#00b4d8', opacity: 0.15 },
};
const DEFAULT_ALERT_COLOR = { fill: '#2ec44a', opacity: 0.15 };

// ── MAP INIT ────────────────────────────────────────────
const map = L.map('map', {
  center: [DEFAULT_LAT, DEFAULT_LNG],
  zoom: DEFAULT_ZOOM,
  zoomControl: true,
});

// Base tile layer — dark CartoDB
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CartoDB</a> &copy; <a href="https://openstreetmap.org">OSM</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// NWS Ridge radar tile layer
let radarLayer = L.tileLayer(
  'https://mesonet.agron.iastate.edu/cache/tile.py/1.0.0/nexrad-n0q-900913/{z}/{x}/{y}.png',
  { opacity: 0.7, attribution: 'Radar: <a href="https://mesonet.agron.iastate.edu/">Iowa Mesonet</a>' }
).addTo(map);

let radarVisible = true;
let alertsVisible = true;
let alertsLayer = L.layerGroup().addTo(map);
let alertsInterval = null;
let userLat = null, userLng = null;

// Hide loading once map tiles load
map.once('load', hideLoading);
setTimeout(hideLoading, 3000); // fallback

function hideLoading() {
  const el = document.getElementById('radar-loading');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }
}

// ── RADAR TOGGLE ────────────────────────────────────────
function toggleRadarLayer() {
  radarVisible = !radarVisible;
  const btn = document.getElementById('toggle-radar-btn');
  if (radarVisible) {
    map.addLayer(radarLayer);
    btn.classList.add('active');
    btn.classList.remove('warn-active');
  } else {
    map.removeLayer(radarLayer);
    btn.classList.remove('active');
  }
}

function toggleAlertsLayer() {
  alertsVisible = !alertsVisible;
  const btn = document.getElementById('toggle-alerts-btn');
  if (alertsVisible) {
    map.addLayer(alertsLayer);
    btn.classList.add('warn-active');
    loadAlerts();
  } else {
    map.removeLayer(alertsLayer);
    btn.classList.remove('warn-active');
  }
}

// ── NWS ALERTS ──────────────────────────────────────────
async function loadAlerts() {
  if (!alertsVisible) return;
  const status = document.getElementById('alerts-status');
  status.textContent = 'Updating alerts...';
  try {
    const res = await fetch('https://api.weather.gov/alerts/active?status=actual&message_type=alert&region_type=land', {
      headers: { 'Accept': 'application/geo+json' }
    });
    const data = await res.json();
    alertsLayer.clearLayers();

    let count = 0;
    (data.features || []).forEach(feature => {
      if (!feature.geometry) return;
      const props = feature.properties;
      const event = props.event || 'Advisory';
      const color = ALERT_COLORS[event] || DEFAULT_ALERT_COLOR;

      const layer = L.geoJSON(feature.geometry, {
        style: {
          color: color.fill,
          fillColor: color.fill,
          fillOpacity: color.opacity,
          weight: 1.5,
          opacity: 0.8,
        }
      });

      const expires = props.expires ? new Date(props.expires).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Unknown';
      const area = props.areaDesc || '';
      layer.bindPopup(`
        <div class="alert-popup">
          <div class="alert-event">${event}</div>
          <strong>${props.headline || event}</strong>
          <div style="margin-top:6px;font-size:0.78rem;color:#7a9bb5">${area}</div>
          <div class="alert-expires">Expires: ${expires}</div>
        </div>
      `);

      alertsLayer.addLayer(layer);
      count++;
    });

    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    status.textContent = count > 0 ? `${count} active alert${count !== 1 ? 's' : ''} · Updated ${now}` : `No active alerts · ${now}`;
  } catch (e) {
    status.textContent = 'Alerts unavailable';
  }
}

// Auto-refresh alerts
loadAlerts();
alertsInterval = setInterval(loadAlerts, ALERTS_REFRESH_MS);

// ── GEOLOCATION ──────────────────────────────────────────
function goToMyLocation() {
  if (!navigator.geolocation) return;
  document.getElementById('alerts-status').textContent = 'Finding location...';
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      map.setView([userLat, userLng], LOCAL_ZOOM);
      document.getElementById('alerts-status').textContent = '';
    },
    () => {
      document.getElementById('alerts-status').textContent = 'Location unavailable';
    },
    { timeout: 8000 }
  );
}

// ── ZIP / CITY SEARCH ────────────────────────────────────
async function searchLocation(e) {
  e.preventDefault();
  const q = document.getElementById('zip-input').value.trim();
  if (!q) return;
  document.getElementById('alerts-status').textContent = 'Searching...';
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&countrycodes=us&format=json&limit=1`,
      { headers: { 'Accept-Language': 'en' } }
    );
    const data = await res.json();
    if (data && data.length > 0) {
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);
      map.setView([lat, lng], LOCAL_ZOOM);
      document.getElementById('alerts-status').textContent = data[0].display_name.split(',').slice(0,2).join(',');
      document.getElementById('zip-input').value = '';
    } else {
      document.getElementById('alerts-status').textContent = 'Location not found';
    }
  } catch {
    document.getElementById('alerts-status').textContent = 'Search unavailable';
  }
}

// ── VIEW PRESETS ─────────────────────────────────────────
let currentViewCenter = [DEFAULT_LAT, DEFAULT_LNG];

function setView(mode) {
  ['local','regional','national'].forEach(v => {
    document.getElementById('view-' + v).classList.remove('active');
  });
  document.getElementById('view-' + mode).classList.add('active');

  const center = (userLat && userLng) ? [userLat, userLng] : currentViewCenter;
  if (mode === 'local')    map.setView(center, LOCAL_ZOOM);
  if (mode === 'regional') map.setView(center, REGIONAL_ZOOM);
  if (mode === 'national') map.setView([DEFAULT_LAT, DEFAULT_LNG], DEFAULT_ZOOM);
}

// ── AUTO GEOLOCATION ON LOAD ─────────────────────────────
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      userLat = pos.coords.latitude;
      userLng = pos.coords.longitude;
      currentViewCenter = [userLat, userLng];
      map.setView([userLat, userLng], LOCAL_ZOOM);
    },
    () => { /* stay at national view */ },
    { timeout: 6000 }
  );
}
</script>
</body>
</html>
